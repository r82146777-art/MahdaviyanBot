name: Post every 30 minutes (5AM-11PM Tehran)

# هر ۵ دقیقه چک — در هر نیم‌ساعت تهران حداکثر یک پست
# مخزن عمومی = بدون سقف دقیقه Actions
on:
  workflow_dispatch:
  repository_dispatch:
    types: [mahdaviyan-post]
  schedule:
    - cron: "0,5,10,15,20,25 * * * *"
    - cron: "30,35,40,45,50,55 * * * *"

concurrency:
  group: mahdaviyan-post-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull newest state before post
        run: git pull --rebase origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send one post if this half-hour is empty
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python post_once.py

      - name: Commit and push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if git diff --staged --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update anti-repeat state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            sleep 3
          done
