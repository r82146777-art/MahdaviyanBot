name: Heartbeat (keep repo active)

# فقط مخزن را فعال نگه می‌دارد تا GitHub schedule را کامل خاموش نکند
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: mahdaviyan-heartbeat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pulse
        run: |
          echo "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .heartbeat

      - name: Commit pulse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "heartbeat: keep repo active" || true
          git pull --rebase origin main || true
          git push origin main || true
