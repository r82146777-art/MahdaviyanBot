name: Daily morning package (8 AM Tehran)

on:
  workflow_dispatch:
  schedule:
    # 04:30 UTC = 08:00 Asia/Tehran
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send morning package
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python daily_morning.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if git diff --staged --quiet; then
            echo "No state change"
          else
            git commit -m "Update morning state"
            git push
          fi
